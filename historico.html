<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propostas · Vendas — Odisse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="https://marca.odisse.com.br/v1/marca.css">
<link rel="stylesheet" href="https://universo.odisse.com.br/base/v1/universo.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app app--no-sidebar" hidden>
  <header class="topo" data-pagina="propostas"></header>
  <script src="topo.js"></script>

  <main class="stage">
    <div class="stage__col" style="max-width: 980px">
      <p class="step__eyebrow">Vendas</p>
      <h1 class="step__title">Propostas</h1>
      <p class="step__desc">Todas as propostas registradas no Universo. "Baixar PDF" entrega o PDF guardado no momento em que foi gerado; propostas sem PDF guardado são remontadas a partir do cálculo.</p>
      <div id="aviso-migracao"></div>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px">
        <div class="field" style="max-width:360px;flex:1;margin:0"><input type="search" id="filtro" placeholder="Filtrar por código, serviço ou cliente"></div>
        <label class="small muted"><input type="checkbox" id="mostrar-sim" checked> mostrar simulações</label>
      </div>
      <div id="lista"></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>exigirAutenticacao();</script>
<script src="data-loader.js"></script>
<script src="store.js"></script>
<script src="comercial.js"></script>
<script src="calc.js"></script>
<script src="fonts-inter.js"></script>
<script src="pdf.js"></script>
<script>
  let DATA = null;
  let LINHAS = [];

  function situacaoChip(p) {
    const cls = p.situacao === 'aceita' ? 'chip--ok' : p.situacao === 'recusada' || p.situacao === 'expirada' ? 'chip--perda' : p.situacao === 'enviada' ? 'chip--cobre' : '';
    return `<span class="chip ${cls}">${escHtml(nomeDe(SITUACOES_PROPOSTA, p.situacao))}</span>`;
  }

  function desenhar() {
    const lista = document.getElementById('lista');
    const q = document.getElementById('filtro').value.trim().toLowerCase();
    const comSim = document.getElementById('mostrar-sim').checked;
    const linhas = LINHAS.filter(l => (comSim || !l.p.simulacao)).filter(l => !q || `${l.p.codigo} ${l.p.titulo || ''} ${l.opo ? l.opo.titulo : ''}`.toLowerCase().includes(q) || (l.p.simulacao && 'simulação'.includes(q)));
    if (!linhas.length) { lista.innerHTML = '<div class="card"><p class="muted">Nenhuma proposta encontrada.</p></div>'; return; }
    lista.innerHTML = `<table class="tabela">
      <thead><tr><th>Proposta</th><th>Oportunidade</th><th>Data</th><th style="text-align:right">Valor</th><th>Situação</th><th></th></tr></thead>
      <tbody>${linhas.map(({ p, opo }) => `
        <tr>
          <td><strong>${escHtml(p.codigo)}</strong><br><span class="small muted">${escHtml(p.titulo || '')}${p.importada_de ? ' · importada' : ''}</span></td>
          <td>${p.simulacao ? '<span class="chip">simulação</span>' : opo ? `<a href="crm.html#${opo.id}">${escHtml(opo.titulo)}</a>` : '—'}</td>
          <td class="tabular">${p.data ? new Date(p.data + 'T00:00:00').toLocaleDateString('pt-BR') : '—'}</td>
          <td class="tabular" style="text-align:right">${fmtCentavos(p.valor_total)}</td>
          <td>${situacaoChip(p)}</td>
          <td style="white-space:nowrap">
            <button class="btn btn--ghost btn--small" data-pdf="${p.id}">Baixar PDF</button>
            <button class="btn btn--ghost btn--small" data-rev="${p.id}" title="Abre no orçamento com o mesmo número e a revisão seguinte">Revisão</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
    lista.querySelectorAll('[data-pdf]').forEach(b => b.onclick = async () => {
      const p = LINHAS.find(l => l.p.id === b.dataset.pdf).p;
      const rotulo = b.textContent;
      b.textContent = 'Baixando…';
      try {
        const completo = await Universo.ler('propostas', p.id);
        const como = await Comercial.baixarPdf(completo, DATA);
        if (como === 'remontado') alert('Esta proposta não tem PDF guardado: o PDF foi remontado a partir do cálculo salvo.');
      } catch (e) { alert('Não consegui baixar: ' + e.message); }
      b.textContent = rotulo;
    });
    lista.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
      const p = await Universo.ler('propostas', b.dataset.rev);
      if (confirm(`Abrir ${p.codigo} no orçamento como revisão? O rascunho atual do orçamento (se houver) será substituído.`)) {
        Comercial.abrirNoOrcamento(p, { comoRevisao: true });
      }
    });
  }

  async function avisoMigracao() {
    try {
      const res = await fetch(`${CONFIG.workerUrl}/kv/estado`, { headers: cabecalhosAuth() });
      if (!res.ok) return;
      const kv = await res.json();
      if (!kv.encerrado && kv.total) {
        document.getElementById('aviso-migracao').innerHTML =
          `<div class="aviso">Há ${kv.total} propostas no histórico antigo que ainda precisam ser trazidas para o Universo. <a href="migrar.html" style="color:var(--destaque-texto)">Abrir a migração →</a></div>`;
      }
    } catch (_) { /* sem aviso */ }
  }

  async function iniciar() {
    document.getElementById('app').hidden = false;
    document.getElementById('filtro').oninput = desenhar;
    document.getElementById('mostrar-sim').onchange = desenhar;
    avisoMigracao();

    const lista = document.getElementById('lista');
    lista.innerHTML = `<p class="muted">Carregando…</p>`;
    try {
      DATA = await OdisseData.load();
      const propostas = [];
      for (let de = 0; de !== null && propostas.length < 1000;) {
        const r = await Universo.listar('propostas', { limite: 200, de, arquivados: 0 });
        propostas.push(...r.itens);
        de = r.proximo;
      }
      const ops = {};
      const ids = [...new Set(propostas.map(p => p.oportunidade_id).filter(Boolean))];
      await Promise.all(ids.map(async id => { ops[id] = await Universo.talvez('oportunidades', id).catch(() => null); }));
      LINHAS = propostas.map(p => ({ p, opo: ops[p.oportunidade_id] }));
    } catch (e) {
      lista.innerHTML = `<div class="card"><p class="muted">Não consegui carregar o histórico agora (${escHtml(e.message)}).</p></div>`;
      return;
    }
    desenhar();
  }

  iniciar();
</script>
</body>
</html>

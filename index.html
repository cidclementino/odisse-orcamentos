<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento · Vendas — Odisse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="https://marca.odisse.com.br/v1/marca.css">
<link rel="stylesheet" href="https://universo.odisse.com.br/base/v1/universo.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= APP ================= -->
<div id="app" class="app app--no-sidebar" hidden>

  <header class="topo" data-pagina="orcamento"></header>
  <script src="topo.js"></script>

  <div class="orc-aviso" id="orc-aviso" hidden></div>
  <div class="orc">
    <nav class="orc-guia" aria-label="Passos do orçamento">
      <p class="orc-guia__titulo">Orçamento</p>
      <div class="orc-guia__passos" id="orc-guia-passos"></div>
      <p class="orc-guia__versoes" id="orc-versoes"></p>
      <button class="btn btn--text" id="btn-reset" type="button">Recomeçar</button>
    </nav>

    <main class="orc-form">
      <div id="step-container"></div>
      <div class="orc-nav" id="orc-nav">
        <button class="btn btn--ghost" id="btn-prev" type="button">Voltar</button>
        <button class="btn btn--ghost" id="btn-next" type="button">Continuar</button>
      </div>
    </main>

    <aside class="orc-previa" id="orc-previa" aria-label="Prévia de custos e prazos"></aside>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>exigirAutenticacao();</script>
<script src="data-loader.js"></script>
<script src="store.js"></script>
<script src="comercial.js"></script>
<script src="calc.js"></script>
<script src="catalogo.js"></script>
<script src="fonts-inter.js"></script>
<script src="pdf.js"></script>
<script src="steps.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento · Vendas — Odisse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="https://marca.odisse.com.br/v1/marca.css">
<link rel="stylesheet" href="https://universo.odisse.com.br/base/v1/universo.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= APP ================= -->
<div id="app" class="app" hidden>

  <header class="topo" data-pagina="orcamento"></header>
  <script src="topo.js"></script>

  <nav class="sidebar">
    <div class="sidebar__steps" id="sidebar-steps"></div>
    <div class="sidebar__ticket" id="ticket">
      <div class="ticket__block">
        <span class="ticket__label">Honorário estimado</span>
        <span class="ticket__value" id="ticket-total">R$ 0,00</span>
      </div>
      <div class="ticket__block">
        <span class="ticket__label">Prazo total</span>
        <span class="ticket__value ticket__value--small" id="ticket-prazo-duracao">—</span>
        <span class="ticket__value ticket__value--dates" id="ticket-prazo-datas"></span>
      </div>
      <div id="ticket-alerta-orcamento"></div>
      <div id="ticket-alerta-prazo"></div>
      <div class="ticket__sub" id="ticket-sub">Preencha a classificação do serviço para iniciar o cálculo</div>
      <div class="ticket__nav">
        <button class="btn btn--primary" id="btn-next" type="button">Continuar</button>
        <button class="btn btn--ghost" id="btn-prev" type="button">Voltar</button>
        <button class="btn btn--ghost" id="btn-reset" type="button">Recomeçar</button>
      </div>
    </div>
  </nav>

  <main class="stage">
    <div class="stage__col" id="step-container"></div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>exigirAutenticacao();</script>
<script src="data-loader.js"></script>
<script src="store.js"></script>
<script src="comercial.js"></script>
<script src="calc.js"></script>
<script src="fonts-inter.js"></script>
<script src="pdf.js"></script>
<script src="steps.js"></script>
<script src="app.js"></script>
</body>
</html>

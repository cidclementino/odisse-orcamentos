<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Vendas — agora no Universo</title>
<script>
  // Desde 24/11/2026 o vendas mora no Universo: universo.odisse.com.br/vendas/ (mesma senha da equipe).
  (function () {
    var p = location.pathname.split('/').pop() || 'index.html';
    var destino = p === 'login.html' ? '/' : '/vendas/' + (p === '404.html' ? '' : p);
    location.replace('https://universo.odisse.com.br' + destino + location.search + location.hash);
  })();
</script>
</head>
<body><p>O vendas agora fica no <a href="https://universo.odisse.com.br/vendas/">Universo</a>.</p></body>
</html>

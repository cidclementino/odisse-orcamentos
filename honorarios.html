<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon-32x32.png" sizes="32x32">

<body>

<div id="app" class="app app--no-sidebar" hidden>
  <header class="topo" data-pagina="honorarios"></header>
  <script src="topo.js?v=6f1d796085"></script>

  <main class="crm">
    <div class="crm__barra">
      <h1>Honorários</h1>
      <div class="gestao__pub" id="pub"></div>
    </div>
    <p class="gestao__intro">O custo sobre a estrutura do estúdio. A estrutura (serviços, fases, etapas, entregas) vem do Projetos:
      <a href="https://projetos.odisse.com.br/bases.html">Bases</a> e <a href="https://projetos.odisse.com.br/pgt.html">Plano Geral de Trabalho</a>.</p>
    <div class="abas gestao__abas" role="tablist">
      <button type="button" data-aba="servicos">Serviços</button>
      <button type="button" data-aba="pesos">Fases e etapas</button>
      <button type="button" data-aba="bh">Base de honorários</button>
      <button type="button" data-aba="tabelas">Tabelas do CAU</button>
    </div>
    <div id="aviso"></div>

    <section data-painel="servicos" hidden><div class="rolagem" id="servicos"><p class="muted">Carregando…</p></div></section>
    <section data-painel="pesos" hidden><div id="entrada"></div><div class="rolagem" id="pesos"></div></section>
    <section data-painel="bh" hidden>
      <div class="gestao__filtros"><input type="search" id="filtro-uso" placeholder="Filtrar usos (descrição, item, CUB)"></div>
      <div id="bh"><p class="muted">Carregando…</p></div>
    </section>
    <section data-painel="tabelas" hidden><div id="tabelas"></div></section>
  </main>
</div>

<div id="painel-raiz"></div>

<script src="config.js?v=07793b6f66"></script>
<script src="auth.js?v=71994a29a1"></script>
<script>exigirAutenticacao();</script>
<script src="data-loader.js?v=b1b3a59ba0"></script>
<script src="store.js?v=66a6878146"></script>
<script src="comercial.js?v=2dc7225c30"></script>
<script src="ui.js?v=2dfbfc5119"></script>
<script>
// ==========================================================================
// Honorários (migração 0006 do Universo): o custo que se aplica sobre as
// Bases e o Plano Geral de Trabalho, que moram na ferramenta Projetos.
//   - preço dos serviços: modificador, tem preço, repartido por etapa
//   - fases e etapas (0015): peso de cada fase por serviço (% do projeto; as do fluxo somam 100, a de
//     acréscimo — Obra — vai além dos 100) e fator 1 ou 2 de cada etapa dentro da fase. A % da etapa é
//     fórmula: fator ÷ soma dos fatores das etapas contratadas da fase (a que não for contratada se
//     redistribui entre as que ficaram). Entrada (na assinatura) como parâmetro do pagamento.
//   - base de honorários de cada uso: CUB vigente (data/cub.json) × fator
// Publicar grava a versão de honorários que as propostas vão registrar.
// ==========================================================================
let H = null;     // GET honorarios
let B = null;     // GET bases (usos e categorias, para a base de honorários)
let CUB = null;   // tabela do CUB da região ativa
const aviso = avisoEm(document.getElementById('aviso'));

const GRUPOS = [
  { id: 'residencial', nome: 'Residencial', cor: 'var(--odisse-pessego, #F2DDBE)' },
  { id: 'comercial', nome: 'Comercial', cor: 'var(--odisse-ambar, #ECC28F)' },
  { id: 'institucional', nome: 'Institucional', cor: 'color-mix(in srgb, var(--odisse-ardosia, #3F4B57) 30%, white)' },
  { id: 'diversos', nome: 'Diversos', cor: 'var(--odisse-areia, #E3D9C6)' }
];
const lerNum = (s) => {
  const t = String(s ?? '').trim().replace(/\s/g, '').replace(',', '.');
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
};
const fmtNum = (n, casas) => (n === null || n === undefined || n === '') ? '' :
  Number(n).toLocaleString('pt-BR', casas === undefined ? { maximumFractionDigits: 4 } : { minimumFractionDigits: casas, maximumFractionDigits: casas });
const fmtReais = (n) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const igual = (a, b) => Math.abs(a - b) < 0.0001;

async function iniciar() {
  document.getElementById('app').hidden = false;
  ligarAbas();
  await carregar({ copia: true });
  carregarBH();
}

// Abre na hora com a cópia local (copia: true, só na entrada) e confere por baixo; depois de gravar, lê do servidor.
async function carregar({ copia = false } = {}) {
  try {
    H = await comCopia('honorarios', () => Universo.get('honorarios'), (novo) => { H = novo; desenhar(); }, { fresco: !copia });
    desenhar();
  } catch (e) { aviso(`Não consegui carregar os honorários (${mensagemDe(e)}).`); }
}

function desenhar() {
  desenharPublicacao();
  desenharServicos();
  desenharPesos();
}

// ---------------------------------------------------------------- publicação
function desenharPublicacao() {
  const el = document.getElementById('pub');
  const p = H.publicacao;
  const quando = p ? new Date(p.publicado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  el.innerHTML = `<span class="gestao-status">
      ${p ? `<span title="${escHtml(p.nota || '')}">Versão <strong>${p.numero}</strong> publicada em ${quando}</span>` : '<span>Ainda não publicado</span>'}
      ${H.pendente ? '<span class="chip chip--pendente">mudanças não publicadas</span>' : '<span class="chip chip--ok">em dia</span>'}
    </span>
    <button class="btn btn--primary btn--small" type="button" ${H.pendente ? '' : 'disabled'}>Publicar versão</button>`;
  el.querySelector('button').onclick = () => {
    const numero = p ? p.numero + 1 : 1;
    const painel = abrirPainel(`
      <div class="painel__topo"><h2>Publicar a versão ${numero} dos honorários</h2><button class="painel__fechar" aria-label="Fechar">×</button></div>
      <div id="pub-aviso"></div>
      <p class="small">Publicar grava um retrato do que está aqui agora (preços, pesos das fases e das etapas, entrada). É esse retrato que as propostas novas vão usar
        e registrar, junto com as versões das Bases e do Plano Geral de Trabalho. O rascunho continua editável depois.</p>
      ${somasRuins().length ? `<div class="aviso aviso--erro">Fases que não somam 100%: ${escHtml(somasRuins().join(', '))}.</div>` : ''}
      <form id="f-pub">
        <div class="field"><label class="field__label">O que mudou (opcional)</label>
          <textarea name="nota" rows="3" maxlength="500" placeholder="Ex.: pesos de Interiores revisados"></textarea></div>
        <div class="painel__acoes"><button class="btn btn--primary btn--small" type="submit">Publicar</button></div>
      </form>`);
    const av = avisoEm(painel.querySelector('#pub-aviso'));
    painel.querySelector('#f-pub').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await Universo.post('honorarios/publicar', { nota: e.target.nota.value.trim() || null });
        fecharPainel();
        carregar();
      } catch (err) { av(err.status === 409 ? 'Nada mudou desde a última versão publicada.' : mensagemDe(err)); }
    };
  };
}
function marcarPendente() { H.pendente = true; desenharPublicacao(); }

// ---------------------------------------------------------------- serviços (preço)
function desenharServicos() {
  const sn = [{ id: '1', nome: 'Sim' }, { id: '0', nome: 'Não' }];
  document.getElementById('servicos').innerHTML = `<table class="tabela">
    <thead><tr><th>Sigla</th><th>Serviço</th><th class="centro">Tem preço</th><th class="centro">Modificador</th><th class="centro">Repartido por etapa</th></tr></thead>
    <tbody>${H.servicos.map((s) => `<tr data-id="${s.id}">
      <td class="sigla">${escHtml(s.sigla)}</td><td><strong>${escHtml(s.nome)}</strong></td>
      <td class="centro"><select data-c="com_preco">${opcoes(sn, String(s.com_preco))}</select></td>
      <td class="centro"><input class="cel" data-c="modificador" inputmode="decimal" value="${fmtNum(s.modificador)}" placeholder="—"></td>
      <td class="centro"><select data-c="preco_por_etapa">${opcoes(sn, String(s.preco_por_etapa))}</select></td></tr>`).join('')}</tbody></table>
    <p class="field__hint">Modificador: multiplica o valor do CAU (Nova Edificação = 1,00 é a referência). Repartido por etapa: o honorário se divide
      pelas fases e etapas (aba Fases e etapas). Serviços novos são criados nas Bases, no Projetos, e chegam aqui sem preço.</p>`;
  document.querySelectorAll('#servicos [data-c]').forEach((c) => c.onchange = async () => {
    const s = H.servicos.find((x) => x.id === c.closest('tr').dataset.id);
    let v = c.value;
    if (c.dataset.c === 'modificador') {
      v = lerNum(v);
      if (Number.isNaN(v) || (v !== null && v <= 0)) { aviso('Modificador: número maior que zero (ex.: 1,25).'); c.value = fmtNum(s.modificador); return; }
    } else v = Number(v);
    c.disabled = true;
    try {
      const r = await Universo.alterar('bases-servicos', s.id, { versao: s.versao, [c.dataset.c]: v });
      Object.assign(s, { [c.dataset.c]: r[c.dataset.c], versao: r.versao });
      aviso('');
      marcarPendente();
      desenharPesos();
    } catch (err) { aviso(mensagemDe(err)); if (err.status === 409) carregar(); }
    c.disabled = false;
  });
}

// ---------------------------------------------------------------- fases e etapas (0015)
// Peso da fase: % do honorário do projeto, por serviço. As fases do fluxo somam 100; a de acréscimo (Obra) vai além.
// Fator da etapa (1 ou 2): dentro da fase, a etapa leva fator ÷ soma dos fatores das etapas contratadas.
// As % mostradas consideram as etapas pertinentes (P) contratadas; a opcional (O) mostra quanto levaria se marcada.
const comPreco = () => H.servicos.filter((s) => s.com_preco);
const repartidos = () => comPreco().filter((s) => s.preco_por_etapa);
const fasesDoFluxo = () => H.fases.filter((f) => !f.ilha);
const etapasDa = (f, s) => H.etapas.filter((e) => e.fase_id === f.id && e.servicos[s.id]);
const fator = (x) => (x && x.peso === 2 ? 2 : 1);
function somaDe(s) { return fasesDoFluxo().filter((f) => !f.acrescimo).reduce((t, f) => t + (etapasDa(f, s).length ? (f.pesos[s.id] || 0) : 0), 0); }
function acrescimoDe(s) { return fasesDoFluxo().filter((f) => f.acrescimo).reduce((t, f) => t + (etapasDa(f, s).length ? (f.pesos[s.id] || 0) : 0), 0); }
function somasRuins() { return repartidos().filter((s) => !igual(somaDe(s), 100)).map((s) => `${s.sigla} (${fmtNum(somaDe(s))}%)`); }
// % da etapa na fase e no projeto, com as pertinentes da fase (e ela mesma, se opcional)
function partes(e, f, s) {
  const lista = etapasDa(f, s).filter((x) => x.servicos[s.id].pertinencia === 'P' || x.id === e.id);
  const total = lista.reduce((t, x) => t + fator(x.servicos[s.id]), 0);
  const naFase = total ? fator(e.servicos[s.id]) / total : 0;
  return { naFase, noProjeto: naFase * (f.pesos[s.id] || 0) / 100 };
}
const pct = (n) => `${fmtNum(Math.round(n * 1000) / 10)}%`;

// Parâmetros da aba (cartões, como os da Equipe no Universo): entrada do pagamento e o acréscimo do "só tal fase" (0016).
const PARAMS_ABA = [
  { chave: 'parcela_entrada', rotulo: 'Entrada na assinatura', nota: 'O restante do pagamento acompanha o peso das fases contratadas.' },
  { chave: 'acrescimo_lacuna', rotulo: 'Fase anterior não contratada', nota: 'Acréscimo sobre o peso das fases puladas. Em NE, só a Legal: 20% + 50% × 40% = 40%.' },
];
function desenharEntrada() {
  const el = document.getElementById('entrada');
  el.innerHTML = `<div class="hon-params">${PARAMS_ABA.filter((p) => H.parametros_rotulos[p.chave]).map((p) => `
    <label class="hon-param" for="p-${p.chave}">
      <span class="hon-param__rotulo">${escHtml(p.rotulo)}</span>
      <span class="hon-param__valor"><input id="p-${p.chave}" data-param="${p.chave}" inputmode="decimal" value="${H.parametros[p.chave] === undefined ? '' : fmtNum(H.parametros[p.chave] * 100)}"><span>%</span></span>
      <span class="hon-param__nota">${escHtml(p.nota)}</span>
    </label>`).join('')}</div>`;
  el.querySelectorAll('[data-param]').forEach((c) => c.onchange = async (ev) => {
    const chave = c.dataset.param;
    const n = lerNum(ev.target.value);
    if (n === null || Number.isNaN(n) || n < 0 || n > 100) { aviso(`${H.parametros_rotulos[chave]}: número de 0 a 100.`); return desenharEntrada(); }
    try {
      await Universo.post('honorarios/parametros', { chave, valor: n / 100 });
      H.parametros[chave] = n / 100;
      aviso(''); marcarPendente(); desenharEntrada();
    } catch (err) { aviso(mensagemDe(err)); }
  });
}
// "Fase Conceitual" sem repetir "Fase" quando o nome já traz a palavra
const nomeFase = (f) => /^fase\b/i.test(f.nome) ? f.nome : `Fase ${f.nome}`;

// Fases abertas/fechadas (lembradas no computador). Fechada, a fase mostra só o seu peso por serviço.
const CHAVE_ABERTAS = 'vendas:honorarios:fases-abertas';
const abertas = new Set((() => { try { return JSON.parse(localStorage.getItem(CHAVE_ABERTAS) || '[]'); } catch (_) { return []; } })());
const lembrarAbertas = () => { try { localStorage.setItem(CHAVE_ABERTAS, JSON.stringify([...abertas])); } catch (_) { /* sem cópia */ } };

function desenharPesos() {
  desenharEntrada();
  const S = repartidos();
  let html = '';
  for (const f of fasesDoFluxo()) {
    const etapas = H.etapas.filter((e) => e.fase_id === f.id);
    if (!etapas.length) continue;
    const aberta = abertas.has(f.id);
    html += `<tbody class="hon-grupo${aberta ? ' is-aberta' : ''}${f.acrescimo ? ' is-acrescimo' : ''}" data-grupo="${f.id}">
      <tr class="hon-fase"><td><div class="hon-fase__cab">
        <button type="button" class="hon-abrir" data-abrir="${f.id}" aria-expanded="${aberta}" aria-label="${aberta ? 'Fechar' : 'Abrir'} ${escHtml(nomeFase(f))}">
          <span class="hon-seta" aria-hidden="true">▸</span><strong>${escHtml(nomeFase(f))}</strong><span class="hon-conta">${etapas.length} etapa${etapas.length === 1 ? '' : 's'}</span></button>
        <label class="hon-chave" title="Acréscimo: o peso desta fase vai além dos 100% do projeto (ex.: Obra)">
          <input type="checkbox" data-acrescimo="${f.id}" ${f.acrescimo ? 'checked' : ''}><span>${f.acrescimo ? 'acréscimo, além dos 100%' : 'dentro dos 100%'}</span></label></div></td>
      ${S.map((s) => etapasDa(f, s).length
        ? `<td class="centro"><label class="hon-campo-pct" title="${escHtml(`${nomeFase(f)} em ${s.sigla}: % do honorário do projeto${f.acrescimo ? ' (acréscimo, além dos 100%)' : ''}`)}">
            <input class="cel--fase" data-fase="${f.id}" data-srv="${s.id}" inputmode="decimal" value="${fmtNum(f.pesos[s.id])}" placeholder="—"><span>%</span></label></td>`
        : '<td class="centro muted" title="nenhuma etapa desta fase vale para este serviço">–</td>').join('')}</tr>
      ${etapas.map((e) => `<tr class="hon-etapa">
        <td><span class="hon-sigla">${escHtml(e.sigla)}</span>${escHtml(e.nome)}</td>
        ${S.map((s) => {
          const x = e.servicos[s.id];
          if (!x) return '<td class="centro muted" title="a etapa não vale para este serviço">–</td>';
          const p = partes(e, f, s);
          const op = x.pertinencia === 'O';
          return `<td class="centro"><select class="cel cel--fator${op ? ' is-opcional' : ''}" data-etapa="${e.id}" data-srv="${s.id}"
              title="${escHtml(`${e.sigla} em ${s.sigla}${op ? ' (etapa opcional)' : ''}: peso dentro da fase`)}">
              <option value="1" ${fator(x) === 1 ? 'selected' : ''}>1</option><option value="2" ${fator(x) === 2 ? 'selected' : ''}>2</option></select>
            <span class="hon-partes${op ? ' is-opcional' : ''}" title="${op ? 'Etapa opcional: quanto levaria se marcada' : 'Com as etapas pertinentes da fase'}">
              <span><b>${pct(p.naFase)}</b> da fase</span><span><b>${pct(p.noProjeto)}</b> do projeto</span></span></td>`;
        }).join('')}</tr>`).join('')}
    </tbody>`;
  }
  const semRepartir = comPreco().filter((s) => !s.preco_por_etapa);
  const el = document.getElementById('pesos');
  el.innerHTML = `<table class="tabela matriz hon-matriz"><thead>
      <tr><th rowspan="2">Fase / etapa</th><th colspan="${S.length}" class="grupo-srv">Peso por serviço</th></tr>
      <tr>${S.map((s) => `<th class="srv" title="${escHtml(s.nome)}">${escHtml(s.sigla)}</th>`).join('')}</tr></thead>
    ${html}
    <tfoot class="hon-total">
      <tr><td><strong>Soma das fases</strong><span>deve dar 100%</span></td>
        ${S.map((s) => { const n = somaDe(s); return `<td class="centro"><span class="hon-total__n ${igual(n, 100) ? 'ok' : 'ruim'}">${fmtNum(n)}%</span>${acrescimoDe(s) ? `<span class="hon-total__acr">+${fmtNum(acrescimoDe(s))}% acréscimo</span>` : ''}</td>`; }).join('')}</tr>
    </tfoot></table>
    <div class="hon-notas">
      <section><h3>Como ler a tabela</h3><ul>
        <li><span class="hon-ex hon-ex--pct">40<i>%</i></span>Na linha da fase: quanto a fase vale no honorário do projeto, por serviço.</li>
        <li><span class="hon-ex">1 · 2</span>Na linha da etapa: o peso dela dentro da fase.</li>
        <li><span class="hon-ex hon-ex--txt"><b>25%</b> da fase<br><b>10%</b> do projeto</span>Quanto a etapa leva, contando as etapas pertinentes da fase.</li>
        <li><span class="hon-ex hon-ex--op">1</span>Tracejada, com as % em itálico: etapa opcional; mostra quanto levaria se marcada.</li>
        <li><span class="hon-ex">–</span>A etapa não vale para o serviço (marcado no Plano Geral de Trabalho).</li>
      </ul></section>
      <section><h3>Como o preço é calculado</h3><ul>
        <li>As fases do fluxo somam 100%. A fase marcada como acréscimo (Obra) soma por fora, além dos 100%.</li>
        <li>Dentro da fase, a etapa leva o seu peso ÷ a soma dos pesos das etapas contratadas. Etapa não contratada: o valor da fase se redistribui entre as que ficam.</li>
        <li>Fase sem nenhuma etapa contratada fica de fora. Se ela vem antes de uma fase contratada (ex.: só a Legal), entra o acréscimo de "Fase anterior não contratada", lá em cima.</li>
        ${semRepartir.length ? `<li>Preço único, sem repartição por etapa: ${escHtml(semRepartir.map((s) => s.sigla).join(', '))}.</li>` : ''}
      </ul></section>
    </div>`;
  el.querySelectorAll('[data-abrir]').forEach((b) => b.onclick = () => {
    const id = b.dataset.abrir;
    if (abertas.has(id)) abertas.delete(id); else abertas.add(id);
    lembrarAbertas();
    const g = el.querySelector(`[data-grupo="${id}"]`);
    g.classList.toggle('is-aberta', abertas.has(id));
    b.setAttribute('aria-expanded', abertas.has(id));
  });
  el.querySelectorAll('.cel--fase').forEach((c) => c.onchange = async () => {
    const f = H.fases.find((x) => x.id === c.dataset.fase);
    const v = lerNum(c.value);
    if (Number.isNaN(v) || (v !== null && (v < 0 || v > 100))) { aviso('Peso da fase: número de 0 a 100.'); c.value = fmtNum(f.pesos[c.dataset.srv]); return; }
    c.disabled = true;
    try {
      await Universo.post('honorarios/fases', { fase_id: f.id, servico_id: c.dataset.srv, peso: v });
      if (v === null) delete f.pesos[c.dataset.srv]; else f.pesos[c.dataset.srv] = v;
      aviso(''); marcarPendente(); desenharPesos();
    } catch (err) { aviso(mensagemDe(err)); c.disabled = false; }
  });
  el.querySelectorAll('.cel--fator').forEach((c) => c.onchange = async () => {
    const e = H.etapas.find((x) => x.id === c.dataset.etapa);
    const x = e.servicos[c.dataset.srv];
    const v = Number(c.value);
    c.disabled = true;
    try {
      await Universo.post('honorarios/pesos', { etapa_id: e.id, servico_id: c.dataset.srv, peso: v });
      x.peso = v;
      aviso(''); marcarPendente(); desenharPesos();
    } catch (err) { aviso(mensagemDe(err)); c.disabled = false; }
  });
  el.querySelectorAll('[data-acrescimo]').forEach((c) => c.onchange = async () => {
    const f = H.fases.find((x) => x.id === c.dataset.acrescimo);
    c.disabled = true;
    try {
      const r = await Universo.alterar('pgt-fases', f.id, { versao: f.versao, acrescimo: c.checked ? 1 : 0 });
      Object.assign(f, { acrescimo: r.acrescimo, versao: r.versao });
      aviso(''); marcarPendente(); desenharPesos();
    } catch (err) { aviso(mensagemDe(err)); if (err.status === 409) carregar(); c.disabled = false; }
  });
}

// ---------------------------------------------------------------- base de honorários (CUB vigente × fator) e tabelas
async function carregarBH() {
  try {
    const [bases, dados] = await Promise.all([
      comCopia('bases', () => Universo.get('bases'), (novo) => { B = novo; desenharBH(); }),
      OdisseData.load()
    ]);
    const cub = dados.cub, fp = dados.fatorPercentual, red = dados.redutorRepeticao;
    B = bases;
    const r = cub.regioes[cub.regiao_ativa];
    CUB = { regiao: cub.regiao_ativa, fonte: r.fonte, competencia: r.competencia_referencia, tabela: r.tabela };
    desenharBH();
    desenharTabelas(fp, red);
  } catch (e) { document.getElementById('bh').innerHTML = `<p class="small muted">Não consegui carregar as tipologias ou o CUB (${escHtml(mensagemDe(e))}).</p>`; }
}

function desenharBH() {
  const q = semAcento(document.getElementById('filtro-uso').value.trim());
  const casa = (u) => !q || semAcento([u.descricao, u.item, u.cub_codigo].join(' ')).includes(q);
  const vigente = (cod) => (CUB.tabela[cod] ? CUB.tabela[cod].honerado : null);
  let html = '';
  for (const g of GRUPOS) {
    const cats = B.categorias.filter((c) => c.grupo === g.id);
    if (!cats.length) continue;
    let blocos = '';
    for (const c of cats) {
      const usos = B.usos.filter((u) => u.categoria_id === c.id && casa(u));
      if (!usos.length) continue;
      blocos += `<div class="cat-bloco" style="--g:${g.cor}"><h3>${escHtml(c.nome)}</h3>
        <div class="rolagem"><table class="tabela usos">
          <colgroup><col style="width:80px"><col><col style="width:110px"><col style="width:130px"><col style="width:80px"><col style="width:130px"></colgroup>
          <thead><tr><th>Item CAU</th><th>Uso</th><th class="centro">Código do CUB</th><th class="num">CUB vigente</th><th class="centro">Fator</th>
            <th class="num" title="Base de honorários = CUB vigente × fator de adequação">BH (R$/m²)</th></tr></thead>
          <tbody>${usos.map((u) => {
            const v = vigente(u.cub_codigo);
            const usado = v ?? u.cub_referencia;
            return `<tr><td class="codigo">${escHtml(u.item || '')}</td><td>${escHtml(u.descricao)}</td>
              <td class="codigo centro">${escHtml(u.cub_codigo || '—')}</td>
              <td class="num">${v !== null ? fmtReais(v) : `<span class="muted" title="código fora da tabela vigente: vale o CUB de referência do uso">${fmtReais(u.cub_referencia)}*</span>`}</td>
              <td class="centro">${fmtNum(u.fator_adequacao, 2)}</td>
              <td class="num"><strong>${usado !== null && u.fator_adequacao !== null ? fmtReais(usado * u.fator_adequacao) : '—'}</strong></td></tr>`;
          }).join('')}</tbody></table></div></div>`;
    }
    if (blocos) html += `<div class="grupo-faixa" style="--g:${g.cor}">${escHtml(g.nome)}</div>${blocos}`;
  }
  document.getElementById('bh').innerHTML = (html || '<div class="vazio"><p>Nenhum uso com esse filtro.</p></div>') +
    `<p class="field__hint">CUB vigente: ${escHtml(CUB.regiao)} · ${escHtml(CUB.competencia)} (<a href="cub.html">tabela do CUB</a>).
      * código fora da tabela vigente: vale o CUB de referência do uso. Código do CUB, fator e enquadramento de cada uso são editados nas
      <a href="https://projetos.odisse.com.br/bases.html">Bases</a>, no Projetos.</p>`;
}

function desenharTabelas(fp, red) {
  document.getElementById('tabelas').innerHTML = `<div class="ref-grade">
    <div>
      <h3>Fator percentual (CAU) por faixa de área</h3>
      ${fp ? `<table class="tabela"><thead><tr><th>Área (m²)</th><th class="num">Cat. 1</th><th class="num">Cat. 2</th><th class="num">Cat. 3</th><th class="num">Cat. 4</th></tr></thead>
        <tbody>${fp.map((l) => `<tr><td>${escHtml(l.area_limite)}</td>${['baixo', 'medio', 'alto', 'especial'].map((k) => `<td class="num">${fmtNum(l[k] * 100, 2)}%</td>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="field__hint">A coluna é a "categoria do fator percentual" de cada uso (1 a 4), definida nas Bases.</p>` : '<p class="small muted">Não consegui ler a tabela.</p>'}
    </div>
    <div>
      <h3>Redutor por repetição</h3>
      ${red ? `<table class="tabela"><thead><tr><th>Repetições</th><th class="num">Redutor</th></tr></thead>
        <tbody>${red.map((l) => `<tr><td>${escHtml(l.q)}</td><td class="num">${fmtNum(l.r, 2)}</td></tr>`).join('')}</tbody></table>` : ''}
      <h3 style="margin-top:24px">CUB</h3>
      <p class="small">${escHtml(CUB.regiao)} · fonte ${escHtml(CUB.fonte)} · competência ${escHtml(CUB.competencia)}.
        Valores completos em <a href="cub.html">Tabela do CUB</a> (atualizada pelo robô mensal do Sinduscon).</p>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- abas
function ligarAbas() {
  const botoes = [...document.querySelectorAll('.gestao__abas [data-aba]')];
  const mostrar = (id) => {
    botoes.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.aba === id)));
    document.querySelectorAll('[data-painel]').forEach((s) => { s.hidden = s.dataset.painel !== id; });
    try { sessionStorage.setItem('aba:honorarios', id); } catch (_) { /* sem armazenamento */ }
  };
  botoes.forEach((b) => b.onclick = () => mostrar(b.dataset.aba));
  let inicial = location.hash.slice(1);
  if (!botoes.some((b) => b.dataset.aba === inicial)) { try { inicial = sessionStorage.getItem('aba:honorarios') || ''; } catch (_) { inicial = ''; } }
  mostrar(botoes.some((b) => b.dataset.aba === inicial) ? inicial : botoes[0].dataset.aba);
}

document.getElementById('filtro-uso').oninput = () => B && desenharBH();
iniciar();
</script>
